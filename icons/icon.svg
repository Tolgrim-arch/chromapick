<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo base (Dark) -->
  <rect width="512" height="512" rx="112" fill="#000000" />

  <!-- 1. Letra 'C' / Anillo exterior de la paleta -->
  <!-- Radio 160px, grosor 28px, apertura angular de 90 grados a la derecha -->
  <path
    d="M 369 143 A 160 160 0 1 0 369 369"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="28"
    stroke-linecap="round"
  />

  <!-- 2. Muestras de calibración (Slots de paleta) -->
  <g fill="#FFFFFF">
    <rect x="290" y="200" width="18" height="18" rx="4" />
    <rect x="290" y="228" width="18" height="18" rx="4" />
    <rect x="290" y="256" width="18" height="18" rx="4" />
    <rect x="290" y="284" width="18" height="18" rx="4" />
  </g>

  <!-- 3. Pipeta (Pick) central de corte geométrico plano -->
  <g fill="#FFFFFF">
    <!-- Bulbo superior -->
    <path d="M 238 126 C 238 106 246 94 256 94 C 266 94 274 106 274 126 Z" />
    <rect x="234" y="128" width="44" height="8" rx="4" />

    <!-- Cilindro / Cuerpo -->
    <path d="M 242 144 L 270 144 L 270 286 L 259 314 L 253 314 L 242 286 Z" />

    <!-- Calado negativo (visor de cristal interior) -->
    <path d="M 252 156 L 260 156 L 260 274 L 252 274 Z" fill="#000000" />

    <!-- Gota de extracción -->
    <circle cx="256" cy="344" r="10" />
  </g>
</svg>
